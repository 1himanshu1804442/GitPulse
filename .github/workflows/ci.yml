name: GitPulse CI Pipeline

# ==============================================================================
# Continuous Integration Pipeline for GitPulse
# - Backend: Java 17 (Eclipse Temurin) + Spring Boot 3.2 + Maven
# - Frontend: Node.js 20 + React 18 + Vite + ESLint
# - Containerization: Docker multi-stage build validation
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Java Spring Boot Backend CI (JUnit 5 + MockMvc)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Build & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests with Maven
        working-directory: ./backend-spring
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean test -B
          else
            mvn clean test -B
          fi

  # ----------------------------------------------------------------------------
  # Job 2: React Vite Frontend CI
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint & Build (Node 20 / React Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build React Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Multi-Stage Image Build Verification
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: Docker Container Image Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          file: ./backend-spring/Dockerfile
          push: false
          tags: gitpulse-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gitpulse-frontend:test
